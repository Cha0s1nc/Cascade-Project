name: Feature request
description: An idea for something Cascade should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not only the button you want. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Desktop (macOS, Windows, Linux)
        - iPhone or iPad
        - Apple TV
        - Android
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this.
          required: true
