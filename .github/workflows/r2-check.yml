# Temporary: checks the release environment's R2 secrets and the tag ruleset,
# then gets deleted.
name: R2 and tag check

on: workflow_dispatch

jobs:
  r2:
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Upload, read back, fetch publicly, delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          EP: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "r2 check $GITHUB_RUN_ID" > check.txt
          aws s3 cp check.txt "s3://$BUCKET/r2-check.txt" --endpoint-url "$EP"
          aws s3 cp "s3://$BUCKET/r2-check.txt" back.txt --endpoint-url "$EP"
          cmp check.txt back.txt && echo "Read back matches"
          code=$(curl -s -o public.txt -w '%{http_code}' https://plugins.chaosinc.xyz/r2-check.txt)
          echo "Public fetch: HTTP $code"
          cmp check.txt public.txt && echo "Public copy matches" || echo "::warning::plugins.chaosinc.xyz did not serve the file"
          aws s3 rm "s3://$BUCKET/r2-check.txt" --endpoint-url "$EP"

  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN is not on the ruleset's bypass list, so it stands in for
      # anyone who is not the maintainer.
      - name: Try tags as the workflow token
        run: |
          set -u
          fail=0
          try() {  # try <tag> <expect: refused|allowed>
            if git push -q origin "HEAD:refs/tags/$1" 2>err.txt; then got=allowed; else got=refused; fi
            echo "$1: $got (expected $2)"; [ "$got" = refused ] && sed 's/^/    /' err.txt | head -3
            [ "$got" = "$2" ] || fail=1
            if [ "$got" = allowed ]; then
              if git push -q origin ":refs/tags/$1" 2>err.txt; then echo "  deleted"; else echo "  delete refused"; cat err.txt; fail=1; fi
            fi
          }
          try v0.0.0-ruleset-test refused
          try server-v0.0.0-ruleset-test refused
          try v0.0.0-b0-ruleset-test allowed
          exit $fail
