name: Flutter

# Builds the Flutter app in flutter/ and makes its Windows installer and
# Linux tarball, unsigned like the Electron installers. build.yml calls this
# (build-flutter) with the release's version for a [BETA] or release naming
# flutter; a manual run here makes a test build. A pull request touching
# flutter/ gets only the check job (analyze and test): the maintainer builds
# locally, so pushes to dev run nothing here.
#
# No concurrency group: in a call from build.yml it would share one with
# other runs and could cancel a release's build.

on:
  pull_request:
    branches: ['dev']
    paths: ['flutter/**', 'shared/assets/icon.png', 'shared/assets/installer-license.txt', '.github/workflows/flutter.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release version (2.5.0, 2.5.0-b1); empty for a test build
        type: string
        default: ''

permissions:
  contents: read

env:
  # The version the app is developed on. Change it here and locally together.
  # Installed from Flutter's own repository at this tag rather than with a
  # setup action: the repository allows GitHub's own actions only.
  FLUTTER_VERSION: '3.44.1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      # The SDK with Linux's engine files, and the Dart packages: inputs only,
      # never build output, so a release cannot ship something left from an
      # older run. Saved when a job ends with a key not cached yet.
      - name: Restore the Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Restore the Dart packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter
        shell: bash
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            "$RUNNER_TEMP/flutter/bin/flutter" precache --linux
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # A first build compiles smtc_windows' Rust crates from scratch.
    timeout-minutes: 45
    env:
      # Off C:\Users\...\AppData: cargokit's resolve_symlinks.ps1 follows the
      # plugin's symlink into the pub cache and cannot Get-Item the hidden
      # AppData folder on the way.
      PUB_CACHE: D:\pub-cache
    defaults:
      run:
        working-directory: flutter
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The SDK with Windows's engine files, and the Dart packages: inputs only,
      # never build output, so a release cannot ship something left from an
      # older run. Saved when a job ends with a key not cached yet.
      - name: Restore the Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Restore the Dart packages
        uses: actions/cache@v6
        with:
          path: D:\pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter
        shell: bash
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            "$RUNNER_TEMP/flutter/bin/flutter" precache --windows
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # smtc_windows' Rust: the crates cargo downloads, and cargokit's compiled
      # output (its build tool and the crate), keyed on pubspec.lock, which pins
      # the plugin and so its Cargo.lock. Same path every run, so cargo reuses it.
      - name: Restore the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            flutter/build/windows/x64/plugins/smtc_windows/cargokit_build
          key: cargokit-smtc-${{ hashFiles('flutter/pubspec.lock') }}

      # x.y.z for Flutter and the file version (a beta's -bN is dropped:
      # Windows only takes numbers), the whole version for the app and the
      # installer. A test build is 0.0.<run number>.
      - name: Versions
        env:
          INPUT: ${{ inputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          V="${INPUT:-0.0.$RUN}"
          { echo "VERSION=$V"; echo "BUILD_NAME=${V%%-*}"; echo "RUN=$RUN"; } >> "$GITHUB_ENV"

      # smtc_windows builds its Rust part here, with the runner's own Rust.
      - name: Build
        run: flutter build windows --release --build-name "$BUILD_NAME" --build-number "$RUN" --dart-define=CASCADE_VERSION="$VERSION"

      # Flutter does not ship the Visual C++ runtime, and a fresh Windows may
      # not have it. Microsoft allows copying these three next to the exe.
      - name: Add the Visual C++ runtime
        run: |
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" build/windows/x64/runner/Release/
          done

      - name: Make the installer
        shell: pwsh
        run: |
          # Installed for all users (the runner image, choco) or per user (winget).
          $find = { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = & $find }
          if (-not $iscc) { throw "Inno Setup not found" }
          $release = (Resolve-Path build\windows\x64\runner\Release).Path
          $out = "$PWD\dist"
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:BUILD_NAME.$env:RUN" "/DSourceDir=$release" "/O$out" packaging\windows\cascade.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-flutter-windows
          path: flutter/dist/Cascade-Flutter-*
          retention-days: 7

  linux:
    needs: check
    if: github.event_name != 'pull_request'
    # The glibc here (2.39) is the oldest the build runs on: Ubuntu 24.04,
    # Debian 13 and newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      # The packages apt downloads (about 180 MB), so a slow Ubuntu mirror is
      # paid once a month, not every run. The month is in the key because the
      # runner image moves on weekly: a key that never changed would serve an
      # ever older set and apt would quietly fetch more each time.
      - name: Month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the package downloads
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ hashFiles('.github/workflows/flutter.yml') }}
          restore-keys: apt-${{ runner.os }}-

      # Without recommends the list is mostly WebKitGTK's development files.
      # man-db's index rebuild is off: it adds a minute or more after a big
      # install and nothing reads it here.
      - name: Install the build dependencies
        timeout-minutes: 20
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          # apt leaves its files root-owned; the cache step saves as the runner user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          du -sh ~/apt-archives

      # The SDK with Linux's engine files, and the Dart packages: inputs only,
      # never build output, so a release cannot ship something left from an
      # older run. Saved when a job ends with a key not cached yet.
      - name: Restore the Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Restore the Dart packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Flutter
        shell: bash
        run: |
          if [ ! -x "$RUNNER_TEMP/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            "$RUNNER_TEMP/flutter/bin/flutter" precache --linux
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Versions
        env:
          INPUT: ${{ inputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          V="${INPUT:-0.0.$RUN}"
          { echo "VERSION=$V"; echo "BUILD_NAME=${V%%-*}"; echo "RUN=$RUN"; } >> "$GITHUB_ENV"

      - name: Build
        run: flutter build linux --release --build-name "$BUILD_NAME" --build-number "$RUN" --dart-define=CASCADE_VERSION="$VERSION"

      - name: Package
        run: packaging/linux/package.sh build/linux/x64/release/bundle "$VERSION" dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-flutter-linux
          path: flutter/dist/Cascade-Flutter-*
          retention-days: 7
