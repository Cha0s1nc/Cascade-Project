name: Apple

# A pull request touching apple/ gets the CascadeKit tests; a manual run also
# builds the iOS and tvOS apps, unsigned. Pushes to dev run nothing: the
# maintainer builds locally, and the release builds are build.yml's
# build-apple (a [BETA] or release naming apple).

on:
  pull_request:
    branches: ['dev']
    paths: ['apple/**', 'shared/fixtures/**', 'shared/tuning-defaults.json', 'shared/assets/**', 'flutter/assets/fonts/**', '.github/workflows/apple.yml']
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # The project needs the iOS and tvOS 27 SDKs. GitHub ships Xcode 27 as its
    # own image (public preview since 2026-07-16, arm64 only); the macos-26
    # image has no Xcode 27 at all.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Check the Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27' || { echo "Expected Xcode 27"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      # Offline suite; the live-server tests skip themselves without
      # CASCADE_SERVER.
      - name: CascadeKit tests
        working-directory: apple/CascadeKit
        run: swift test

      - name: Generate the Xcode project
        if: github.event_name != 'pull_request'
        run: xcodegen generate

      - name: Build for iOS
        if: github.event_name != 'pull_request'
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadeiOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Build for tvOS
        if: github.event_name != 'pull_request'
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadetvOS
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      # Off while the native Mac app is not ready (NATIVE_MAC_OFF in
      # shared/scripts/release-plan.mjs). Remove the if to build it again.
      - name: Build for macOS
        if: false
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadeMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
