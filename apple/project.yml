name: Cascade

packages:
  CascadeKit:
    path: CascadeKit

# Both targets build the same App/Sources. SwiftUI covers most of the
# difference; where it does not (tvOS has no Slider, and focus replaces touch)
# the views branch on #if os(tvOS) rather than forking into two copies.
targets:
  CascadeiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App/Sources
      # Generated by `npm run icons` from assets/source.png; not GPL, see assets/LICENSE.
      - App/Assets-iOS.xcassets
    dependencies:
      - package: CascadeKit
        product: CascadeKit
    # Generated rather than hand-written, so the CFBundle keys Xcode expects
    # stay in step with the target instead of being maintained twice.
    info:
      path: App/Info.plist
      properties:
        # Load-bearing: whether background audio survives under free
        # provisioning is the first thing the device build has to answer.
        # From build settings, so CI can stamp the release version and the
        # run number (MARKETING_VERSION, CURRENT_PROJECT_VERSION); without
        # these XcodeGen writes a literal 1.0 and 1 that nothing can override.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS/TLS, which is exempt, so App Store Connect does
        # not ask about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        # Declared so the build stops warning that a non-fullscreen app must
        # support every orientation. Music browsing works in all of them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty locally, so automatic signing applies. The TestFlight job in
        # build.yml signs manually and names its profile through this, since
        # a profile passed to xcodebuild directly also lands on the CascadeKit
        # package, which rejects it. See docs/testflight.md.
        PROVISIONING_PROFILE_SPECIFIER: $(CASCADE_PROFILE_IOS)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - CascadeiOSUITests

  CascadetvOS:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - App/Sources
      # Generated by `npm run icons` from assets/source.png; not GPL, see assets/LICENSE.
      - App/Assets-tvOS.xcassets
    dependencies:
      - package: CascadeKit
        product: CascadeKit
    info:
      path: App/Info-tvOS.plist
      properties:
        # From build settings, so CI can stamp the release version and the
        # run number (MARKETING_VERSION, CURRENT_PROJECT_VERSION); without
        # these XcodeGen writes a literal 1.0 and 1 that nothing can override.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS/TLS, which is exempt, so App Store Connect does
        # not ask about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.tvos
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # Empty locally, so automatic signing applies. The TestFlight job in
        # build.yml signs manually and names its profile through this, since
        # a profile passed to xcodebuild directly also lands on the CascadeKit
        # package, which rejects it. See docs/testflight.md.
        PROVISIONING_PROFILE_SPECIFIER: $(CASCADE_PROFILE_TVOS)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - CascadetvOSUITests

  # The native Mac app, replacing the Electron build on macOS. Same bundle id
  # as Electron's appId, so the swap installer accepts either build and users
  # can move between them in place. Ad-hoc signed, no sandbox: Discord's IPC
  # socket, the localhost control server and ~/.cascade-control-token all
  # need it. See docs/mac-native-plan.md.
  CascadeMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - App/Sources
      - App/Mac
      - path: ../assets/icon.icns
        buildPhase: resources
    dependencies:
      - package: CascadeKit
        product: CascadeKit
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: icon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Electron reaches plain-http LAN servers today, so this must too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # macOS 15 asks before an app reaches the local network; most
        # Jellyfin servers live there.
        NSLocalNetworkUsageDescription: Cascade connects to your Jellyfin server and to devices on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade
        PRODUCT_NAME: Cascade
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
      configs:
        # Debug builds are a different app to macOS: their own defaults,
        # Application Support folder and token, so a development build never
        # reads or signs out of the installed app's session.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.dev

  # Presses Siri Remote buttons from a script, so the TV app can be exercised
  # without a person at the simulator. See UITests/tvOS/RemoteScript.swift.
  CascadetvOSUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - UITests/tvOS
    dependencies:
      - target: CascadetvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.tvos.uitests
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  # The phone's counterpart: taps, long-presses and screenshots from a script.
  # See UITests/iOS/TapScript.swift.
  CascadeiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - UITests/iOS
    dependencies:
      - target: CascadeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.ios.uitests
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
