name: Build

on:
  # stable: a "Release (x.x.X) [platforms]" commit in the pushed range makes a
  # draft release; without one it only builds. dev: a "[BETA]" commit
  # publishes a prerelease; anything else does nothing past the setup job.
  # The rules live in src/core/release-plan.ts (tested) and
  # docs/release-pipeline-plan.md.
  #
  # NOT tags. Releases are created as drafts, and publishing a draft creates
  # its tag - which pushed a 'v*' tag, retriggered this workflow, and had it
  # rebuild and overwrite the assets that had just been published.
  push:
    branches: ['stable', 'dev']
  # Manual runs build any branch and never publish: no bump is a test build
  # (installers on the run page, no release); a bump or beta makes a draft.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Make a draft release, bumping the last published version'
        type: choice
        options: ['', 'patch', 'minor', 'major']
        default: ''
      platforms:
        description: 'Platforms to build: all, or a list such as "desktop, apple"'
        required: false
        default: 'all'
      beta:
        description: 'Make a -bN beta draft instead'
        type: boolean
        default: false

permissions:
  contents: write

# Two runs on one branch cannot claim the same version: they queue.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Decide what this run does ─────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      desktop: ${{ steps.plan.outputs.desktop }}
      apple: ${{ steps.plan.outputs.apple }}
      android: ${{ steps.plan.outputs.android }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      last_tag: ${{ steps.plan.outputs.last_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Every value reaches the script through env, never pasted into the
      # script itself: commit messages are read from git inside it.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_BETA: ${{ inputs.beta }}
        run: |
          # The latest PUBLISHED, non-prerelease release: never a draft.
          LAST_TAG=$(gh release view --json tagName -q .tagName)
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          export LAST_VERSION="$LAST_TAG"
          # Drafts included, so a beta number is never reused.
          export TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          node scripts/release-plan.mjs plan

      # A release with no changelog section is refused before anything builds.
      - name: Check the changelog has this version
        if: steps.plan.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/changelog-section.mjs "$VERSION" > /dev/null

  # ── Test and typecheck ────────────────────────────────────────────────────
  # Gates every build job below: a red test or a type error must never reach
  # a packaged build, let alone a release draft.
  test:
    needs: setup
    if: needs.setup.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build:apple no-ops off macOS, and build:bergamot only unpacks files
      # already fetched by npm ci, so the full build:ts is safe and free on
      # Linux - no point splitting it just to run on ubuntu.
      - name: Build TypeScript
        run: npm run build:ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    needs: [setup, test]
    if: needs.setup.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Empty for a build without a release: package.json's version stays.
      - name: Set version
        if: needs.setup.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build (Windows)
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*.exe
          retention-days: 7

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    needs: [setup, test]
    if: needs.setup.outputs.desktop == 'true'
    # Pinned rather than macos-latest: the Apple Translation helper needs the
    # macOS 26 SDK, and a runner rollback would fail the build in a way that
    # looks unrelated to the label.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Empty for a build without a release: package.json's version stays.
      - name: Set version
        if: needs.setup.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      # Disabled: the only cert available is self-signed, which Gatekeeper treats
      # as a BROKEN signature ("app is damaged", no Open Anyway button) rather
      # than as unsigned. Ad-hoc signing gets the friendlier "unidentified
      # developer" path instead. Re-enable this and the auto-discovery flag below
      # if a real Apple Developer ID ever replaces the self-signed cert.
      - name: Import code-signing certificate
        if: false
        run: |
          echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build (macOS)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: dist/*.dmg
          retention-days: 7

  # ── Linux (AppImage + RPM) ─────────────────────────────────────────────────
  build-linux:
    needs: [setup, test]
    if: needs.setup.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot dpkg

      # Empty for a build without a release: package.json's version stays.
      - name: Set version
        if: needs.setup.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build (Linux)
        run: npm run build:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-appimage
          path: dist/*.AppImage
          retention-days: 7

      - name: Upload RPM (Fedora)
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-rpm
          path: dist/*.rpm
          retention-days: 7

      - name: Upload DEB (Debian/Ubuntu)
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-deb
          path: dist/*.deb
          retention-days: 7


  # ── iOS and tvOS ─────────────────────────────────────────────────────────
  # Unsigned: the maintainer has no paid Apple developer account yet. The
  # .ipa files are re-signed at install time (Sideloadly, Xcode); the
  # .xcarchive keeps the debug symbols for reading crash logs later.
  build-apple:
    needs: setup
    if: needs.setup.outputs.apple == 'true'
    # Xcode 27 is its own image; macos-26 does not have it.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: CascadeKit tests
        working-directory: apple/CascadeKit
        run: swift test

      - name: Generate the Xcode project
        run: xcodegen generate

      # The marketing version is x.y.z (a beta's -bN is dropped: Apple only
      # takes numbers); the build number is the run number, which only goes
      # up, as the stores require.
      - name: Archive and package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NAME="${VERSION:-build-$BUILD}"
          MARKETING="${VERSION%%-*}"
          MARKETING="${MARKETING:-0.0.$BUILD}"
          mkdir -p dist
          for p in iOS tvOS; do
            xcodebuild archive -project Cascade.xcodeproj -scheme "Cascade$p" \
              -destination "generic/platform=$p" -archivePath "build/Cascade-$p.xcarchive" \
              MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            APP=$(ls -d build/Cascade-$p.xcarchive/Products/Applications/*.app | head -1)
            rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
            zip -qry "dist/Cascade-$NAME-$p.ipa" Payload
            ditto -c -k --keepParent "build/Cascade-$p.xcarchive" "dist/Cascade-$NAME-$p.xcarchive.zip"
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-apple
          path: apple/dist/*
          retention-days: 7

  # ── TestFlight ─────────────────────────────────────────────────────────────
  # Off until the paid Apple Developer Program exists: it runs only when the
  # repository variable TESTFLIGHT is "true", after the setup in
  # docs/testflight.md. Uploads every published beta (a [BETA] commit pushed
  # to dev) to TestFlight, iOS and tvOS, with the same version and build
  # number as the sideload builds above. Independent of the release job, so a
  # failed upload never holds up the GitHub prerelease.
  #
  # Signing is manual: a distribution certificate and one App Store profile
  # per app, installed from secrets. (Automatic signing on a fresh runner would
  # create a new certificate every run, and Apple caps how many can exist.)
  testflight:
    needs: setup
    if: vars.TESTFLIGHT == 'true' && needs.setup.outputs.apple == 'true' && needs.setup.outputs.mode == 'beta' && needs.setup.outputs.publish == 'true'
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install the signing certificate, profiles and API key
        env:
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_IOS: ${{ secrets.APPLE_PROFILE_IOS }}
          PROFILE_TVOS: ${{ secrets.APPLE_PROFILE_TVOS }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # A throwaway keychain with a random password, first in the search list.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          # Profiles go where both older and newer Xcode look, named by UUID.
          # Their names are what the build and the export refer to.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; done
          for p in IOS TVOS; do
            var="PROFILE_$p"
            printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/$p.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$p.mobileprovision" > "$RUNNER_TEMP/$p.plist"
            UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/$p.plist")
            NAME=$(plutil -extract Name raw "$RUNNER_TEMP/$p.plist")
            cp "$RUNNER_TEMP/$p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            cp "$RUNNER_TEMP/$p.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
            echo "PROFILE_NAME_$p=$NAME" >> "$GITHUB_ENV"
          done

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # Same numbers as build-apple: x.y.z without the beta suffix (TestFlight
      # groups a version's betas under it) and the run number as the build.
      - name: Archive, sign and upload
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ github.run_number }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ISSUER: ${{ vars.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          MARKETING="${VERSION%%-*}"
          AUTH=(-authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          for p in iOS tvOS; do
            case $p in
              iOS)  BUNDLE=xyz.chaosinc.cascade.ios;  PROFILE="$PROFILE_NAME_IOS" ;;
              tvOS) BUNDLE=xyz.chaosinc.cascade.tvos; PROFILE="$PROFILE_NAME_TVOS" ;;
            esac
            xcodebuild archive -project Cascade.xcodeproj -scheme "Cascade$p" \
              -destination "generic/platform=$p" -archivePath "build/Cascade-$p.xcarchive" \
              MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD" \
              DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
              CASCADE_PROFILE_IOS="$PROFILE_NAME_IOS" CASCADE_PROFILE_TVOS="$PROFILE_NAME_TVOS" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
            # destination upload: the export goes straight to App Store
            # Connect. The build number is ours, so Xcode must not change it.
            cat > "build/ExportOptions-$p.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "build/Cascade-$p.xcarchive" \
              -exportOptionsPlist "build/ExportOptions-$p.plist" -exportPath "build/export-$p" "${AUTH[@]}"
          done

      - name: Remove the keychain and key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/IOS.plist "$RUNNER_TEMP"/TVOS.plist

  # ── Release ────────────────────────────────────────────────────────────────
  # A draft (always, except a [BETA] pushed to dev, which is published as a
  # prerelease) holding the new builds, the unchanged platforms' files copied
  # from the latest published release, versions.json saying which version
  # each platform really is, and notes from CHANGELOG.md. A platform whose
  # build failed is carried over instead and named in the notes; the draft
  # is for the maintainer to check before publishing.
  release:
    needs: [setup, test, build-windows, build-mac, build-linux, build-apple]
    if: >-
      always() && needs.setup.result == 'success' &&
      (needs.setup.outputs.mode == 'release' || needs.setup.outputs.mode == 'beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.setup.outputs.mode }}
          VERSION: ${{ needs.setup.outputs.version }}
          TAG: ${{ needs.setup.outputs.tag }}
          LAST_TAG: ${{ needs.setup.outputs.last_tag }}
          PUBLISH: ${{ needs.setup.outputs.publish }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
          WANT_DESKTOP: ${{ needs.setup.outputs.desktop }}
          WANT_APPLE: ${{ needs.setup.outputs.apple }}
          WIN: ${{ needs.build-windows.result }}
          MAC: ${{ needs.build-mac.result }}
          LINUX: ${{ needs.build-linux.result }}
          APPLE: ${{ needs.build-apple.result }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release carried
          REBUILT=(); CARRIED=(); FAILED=()

          # Desktop counts as rebuilt only if all three builds made it: one
          # desktop version per release, as versions.json says.
          if [ "$WANT_DESKTOP" = true ]; then
            if [ "$WIN" = success ] && [ "$MAC" = success ] && [ "$LINUX" = success ]; then
              REBUILT+=(desktop)
              cp artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm release/
            else
              FAILED+=(desktop)
            fi
          fi
          if [ "$WANT_APPLE" = true ]; then
            if [ "$APPLE" = success ]; then
              REBUILT+=(apple)
              cp artifacts/*.ipa artifacts/*.xcarchive.zip release/
            else
              FAILED+=(apple)
            fi
          fi
          if [ ${#REBUILT[@]} -eq 0 ]; then
            echo "::error::Nothing built successfully; not making a release."
            exit 1
          fi

          # Carry-over: a stable release always holds every platform's newest
          # files, so nobody has to dig through older releases. Betas do not.
          if [ "$MODE" = release ]; then
            gh release download "$LAST_TAG" -p versions.json -D carried 2>/dev/null || true
            for p in desktop apple android; do
              [[ " ${REBUILT[*]} " == *" $p "* ]] && continue
              case $p in
                desktop) PATTERNS=('*.exe' '*.dmg' '*.AppImage' '*.deb' '*.rpm') ;;
                apple)   PATTERNS=('*.ipa' '*.xcarchive.zip') ;;
                android) PATTERNS=('*.apk' '*.aab') ;;
              esac
              ARGS=(); for pat in "${PATTERNS[@]}"; do ARGS+=(-p "$pat"); done
              mkdir -p "carried/$p"
              gh release download "$LAST_TAG" "${ARGS[@]}" -D "carried/$p" 2>/dev/null || true
              FILES=(carried/$p/*)
              if [ ${#FILES[@]} -gt 0 ]; then CARRIED+=("$p"); cp "${FILES[@]}" release/; fi
            done
          fi

          join() { local IFS=,; echo "$*"; }
          VERSION="$VERSION" REBUILT="$(join "${REBUILT[@]}")" CARRIED="$(join "${CARRIED[@]+"${CARRIED[@]}"}")" \
            PREVIOUS_FILE=carried/versions.json PREVIOUS_VERSION="$LAST_TAG" \
            node scripts/release-plan.mjs versions > release/versions.json
          echo "versions.json: $(cat release/versions.json)"

          # Notes: the changelog section (required for a release, checked in
          # setup), then what was carried over and what failed.
          if ! node scripts/changelog-section.mjs "${VERSION%%-*}" > notes.md 2>/dev/null; then
            echo "Beta build $VERSION." > notes.md
          fi
          name() { case $1 in desktop) echo Desktop ;; apple) echo "iOS and tvOS" ;; android) echo Android ;; esac; }
          if [ ${#CARRIED[@]} -gt 0 ]; then
            { echo; echo '---'; echo; echo "Unchanged in this release, carried over from $LAST_TAG:"; echo
              for p in "${CARRIED[@]}"; do echo "- $(name "$p") $(jq -r --arg p "$p" '.[$p] // "?"' release/versions.json)"; done
            } >> notes.md
          fi
          if [ ${#FAILED[@]} -gt 0 ]; then
            { echo; for p in "${FAILED[@]}"; do echo "**The $(name "$p") build failed in this run.** Check it before publishing."; done; } >> notes.md
          fi

          FLAGS=(--title "$TAG" --notes-file notes.md --target "$SHA")
          [ "$PUBLISH" = true ] || FLAGS+=(--draft)
          [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
          gh release create "$TAG" "${FLAGS[@]}" release/*
          echo "Made $TAG ($([ "$PUBLISH" = true ] && echo published || echo draft)) with: $(ls release | tr '\n' ' ')"
