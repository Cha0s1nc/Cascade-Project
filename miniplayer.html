<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cascade</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Lets .wrap below switch layout by the WINDOW's own height (vertical
   resize, task: drag taller -> art grows, drag short -> compact bar) rather
   than needing a resize listener in JS. */
html { container-type: size; }

body {
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111113;
  color: #e8e8e9;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
  /* NOT a drag region, and no longer a click target. Both were a mistake: a
     drag region hands its mouse events to the OS, so `body:hover` did not fire
     reliably and the close button it was revealing stayed at opacity 0. An
     invisible button is an unclickable one, which is why this still could not
     be closed after the first fix. Dragging is the art and the text strip now,
     which is most of the window anyway, and the close button is always
     visible. */
}

/* Blurred cover behind everything, the way Apple Music tints its miniplayer.
   Only shown in the taller layout, where there is room to see it. */
.backdrop {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover; background-position: center;
  filter: blur(28px) saturate(1.4); transform: scale(1.4);
  opacity: 0; transition: opacity 0.3s ease;
}

.close-btn {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 20px; height: 20px; border-radius: 50%;
  border: none; background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.85);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 0.55;
  transition: opacity 0.12s, background 0.12s, color 0.12s;
  -webkit-app-region: no-drag;
  /* Confirmed against main.js: this window never sets titleBarOverlay, so
     unlike the main window's top-right corner (see --caption-reserve in
     index.html) there are no OS caption buttons drawn here to collide with. */
}
.close-btn:hover { opacity: 1; background: rgba(0,0,0,0.75); color: #fff; }

/* ── Compact bar (default, under 180px tall) ── */
.wrap {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  height: 100%; padding: 10px;
  -webkit-app-region: drag;
}

.art {
  width: 64px; height: 64px; border-radius: 6px;
  background: #2a2a2c; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: rgba(255,255,255,0.25);
}
.art img { width: 100%; height: 100%; object-fit: cover; }

.stack { display: contents; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

/* ── Art-forward (180px and taller) ──
   Full-bleed art with the text and transport stacked beneath it over the
   blurred backdrop. This is what the compact bar grows into, and the reason
   the window resizes vertically at all. */
@container (min-height: 180px) {
  .backdrop { opacity: 0.5; }
  .wrap { flex-direction: column; align-items: stretch; padding: 0; gap: 0; }
  .art {
    width: 100%; height: auto; flex: 1 1 auto; min-height: 0;
    border-radius: 0; font-size: 40px;
  }
  .stack {
    display: block; flex: 0 0 auto; padding: 12px 14px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0.25));
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .info { gap: 8px; margin-bottom: 10px; }
  .title { font-size: 15px; }
  .artist { font-size: 12px; }
  .controls { justify-content: center; gap: 8px; }
  .ctrl-btn { width: 34px; height: 34px; }
  .ctrl-btn.play { width: 40px; height: 40px; }
}

.empty {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
}
</style>
</head>
<body>

<button class="close-btn" id="btn-close" title="Close">
  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
</button>

<div class="backdrop" id="backdrop"></div>

<div class="wrap">
  <div class="art" id="art">♪</div>
  <div class="stack">
  <div class="info">
    <div class="title" id="title">Nothing playing</div>
    <div class="artist" id="artist"></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev" title="Previous">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="ctrl-btn play" id="btn-playpause" title="Play/Pause">
      <svg id="icon-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="icon-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-next" title="Next">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>
  </div>
</div>

<script>
// Every control here forwards to the main window's own existing button
// handlers over IPC (see onControl in renderer.js) - this window never
// touches playback itself. See CODEMAP.md: the two <video> decks and the Web
// Audio graph they feed only exist in the main window.

function fmtSec(s) {
  s = Math.max(0, Math.floor(s || 0))
  const m = Math.floor(s / 60)
  const sec = String(s % 60).padStart(2, '0')
  return `${m}:${sec}`
}

window.miniPlayer.onState((state) => {
  if (!state || !state.itemId) {
    document.getElementById('title').textContent = 'Nothing playing'
    document.getElementById('artist').textContent = ''
    document.getElementById('art').innerHTML = '♪'
    document.getElementById('prog-fill').style.width = '0%'
    return
  }

  document.getElementById('title').textContent = state.title || ''
  document.getElementById('artist').textContent = state.subtitle || ''
  document.getElementById('prog-fill').style.width = `${state.progressPct || 0}%`

  const art = document.getElementById('art')
  if (state.artUrl) {
    if (art.dataset.src !== state.artUrl) {
      art.dataset.src = state.artUrl
      art.innerHTML = `<img src="${state.artUrl}" alt="" onerror="this.parentElement.innerHTML='♪'">`
      document.getElementById('backdrop').style.backgroundImage = `url("${state.artUrl}")`
    }
  } else {
    art.dataset.src = ''
    art.innerHTML = '♪'
    document.getElementById('backdrop').style.backgroundImage = ''
  }

  document.getElementById('icon-play').style.display  = state.isPlaying ? 'none' : ''
  document.getElementById('icon-pause').style.display = state.isPlaying ? '' : 'none'
})

document.getElementById('btn-playpause').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('playpause')
})
document.getElementById('btn-prev').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('prev')
})
document.getElementById('btn-next').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('next')
})

// Closing the miniplayer and going back to the main window are the same
// operation here: main.js closes this window and restores the main one from
// its 'closed' event, so every path converges there whatever triggered it.
document.getElementById('btn-close').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.restore()
})

// Clicking the art or the text goes back to the main window, the way clicking
// a Spotify or Apple Music miniplayer does. Bound to those rather than to
// document.body: the transport buttons sit inside .wrap too, and a body-level
// handler fires for them as well, so hitting pause also threw you back to the
// main window.
document.getElementById('art').addEventListener('click', () => window.miniPlayer.restore())
document.querySelector('.info').addEventListener('click', () => window.miniPlayer.restore())
</script>
</body>
</html>
