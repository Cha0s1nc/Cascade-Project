name: Cascade

packages:
  CascadeKit:
    path: CascadeKit

# Both targets build the same App/Sources. SwiftUI covers most of the
# difference; where it does not (tvOS has no Slider, and focus replaces touch)
# the views branch on #if os(tvOS) rather than forking into two copies.
targets:
  CascadeiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App/Sources
    dependencies:
      - package: CascadeKit
        product: CascadeKit
    # Generated rather than hand-written, so the CFBundle keys Xcode expects
    # stay in step with the target instead of being maintained twice.
    info:
      path: App/Info.plist
      properties:
        # Load-bearing: whether background audio survives under free
        # provisioning is the first thing the device build has to answer.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.ios
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"

  CascadetvOS:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - App/Sources
    dependencies:
      - package: CascadeKit
        product: CascadeKit
    info:
      path: App/Info-tvOS.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chaosinc.cascade.tvos
        DEVELOPMENT_TEAM: 8SF895GF9C
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
