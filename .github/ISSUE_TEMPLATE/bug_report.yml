name: Bug report
description: Something in Cascade doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through [private reporting](https://github.com/Cha0s1nc/Cascade-Project/security/advisories/new) instead, not here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - iPhone or iPad
        - Apple TV
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build (Mac only)
      description: Two Mac apps ship for now. The native one is installed from Cascade-Native-x.y.z.dmg, or through "Try the native Mac app" in Settings, About. Anything else on a Mac is the Electron one.
      options:
        - Not on a Mac
        - Electron
        - Native
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cascade version
      description: Settings, About. Say if it's a beta.
      placeholder: 2.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 27.0, Windows 11 24H2, Ubuntu 24.04, iOS 27.0
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
      description: Jellyfin's dashboard shows it. Many bugs depend on it.
      placeholder: 10.11.2
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an album
        2. Turn on shuffle
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: On desktop, press F12 (or on a Mac, View, Toggle Developer Tools) and open Console. Remove your server address and anything private first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this.
          required: true
