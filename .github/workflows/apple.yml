name: Apple

# Tests and builds the iOS, tvOS and Mac apps in apple/ on every change to it.
# Builds only, unsigned: releasing the Apple app is phase 6 of
# docs/release-pipeline-plan.md.

on:
  push:
    branches: ['dev']
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    branches: ['dev']
    paths: ['apple/**', '.github/workflows/apple.yml']
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # The project needs the iOS and tvOS 27 SDKs. GitHub ships Xcode 27 as its
    # own image (public preview since 2026-07-16, arm64 only); the macos-26
    # image has no Xcode 27 at all.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      - name: Check the Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27' || { echo "Expected Xcode 27"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      # Offline suite; the live-server tests skip themselves without
      # CASCADE_SERVER.
      - name: CascadeKit tests
        working-directory: apple/CascadeKit
        run: swift test

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iOS
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadeiOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Build for tvOS
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadetvOS
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Build for macOS
        run: >
          xcodebuild -project Cascade.xcodeproj -scheme CascadeMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
