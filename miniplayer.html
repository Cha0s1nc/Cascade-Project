<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cascade</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Lets .wrap below switch layout by the WINDOW's own height (vertical
   resize, task: drag taller -> art grows, drag short -> compact bar) rather
   than needing a resize listener in JS. */
html { container-type: size; }

body {
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111113;
  color: #e8e8e9;
  -webkit-user-select: none;
  user-select: none;
  /* The whole window is the restore target, so the whole window drags -
     buttons opt back out with no-drag below. */
  -webkit-app-region: drag;
  cursor: pointer;
}

.wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 100%;
  padding: 10px;
}

.art {
  width: 64px;
  height: 64px;
  border-radius: 6px;
  background: #2a2a2c;
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: rgba(255,255,255,0.25);
}
.art img { width: 100%; height: 100%; object-fit: cover; }

.info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Taller than a compact bar: stack art above the transport and let it grow
   with the window, the same way Apple Music's miniplayer does. */
@container (min-height: 180px) {
  .wrap { flex-direction: column; padding: 16px; gap: 12px; }
  .art { width: min(100%, 70cqh); height: min(100%, 70cqh); font-size: 40px; }
  .info { flex: 0 0 auto; width: 100%; align-items: center; text-align: center; }
  .title, .artist { max-width: 100%; }
}

.close-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.45);
  color: rgba(255,255,255,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.12s, background 0.12s, color 0.12s;
  -webkit-app-region: no-drag;
  /* Confirmed against main.js: this window never sets titleBarOverlay, so
     unlike the main window's top-right corner (see --caption-reserve in
     index.html) there are no OS caption buttons drawn here on any platform
     to collide with. */
}
.close-btn:hover { background: rgba(0,0,0,0.7); color: #fff; }
body:hover .close-btn { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .close-btn { transition: none; }
}

.title {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.prog-bar {
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  width: 0%;
  background: rgba(255,255,255,0.8);
  border-radius: 2px;
  transition: width 0.2s linear;
}
@media (prefers-reduced-motion: reduce) {
  .prog-fill { transition: none; }
}

.controls {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}

.ctrl-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.ctrl-btn.play { width: 32px; height: 32px; }

.empty {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
}
</style>
</head>
<body>

<button class="close-btn" id="btn-close" title="Close">
  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
</button>

<div class="wrap">
  <div class="art" id="art">♪</div>
  <div class="info">
    <div class="title" id="title">Nothing playing</div>
    <div class="artist" id="artist"></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev" title="Previous">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="ctrl-btn play" id="btn-playpause" title="Play/Pause">
      <svg id="icon-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="icon-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-next" title="Next">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>
</div>

<script>
// Every control here forwards to the main window's own existing button
// handlers over IPC (see onControl in renderer.js) - this window never
// touches playback itself. See CODEMAP.md: the two <video> decks and the Web
// Audio graph they feed only exist in the main window.

function fmtSec(s) {
  s = Math.max(0, Math.floor(s || 0))
  const m = Math.floor(s / 60)
  const sec = String(s % 60).padStart(2, '0')
  return `${m}:${sec}`
}

window.miniPlayer.onState((state) => {
  if (!state || !state.itemId) {
    document.getElementById('title').textContent = 'Nothing playing'
    document.getElementById('artist').textContent = ''
    document.getElementById('art').innerHTML = '♪'
    document.getElementById('prog-fill').style.width = '0%'
    return
  }

  document.getElementById('title').textContent = state.title || ''
  document.getElementById('artist').textContent = state.subtitle || ''
  document.getElementById('prog-fill').style.width = `${state.progressPct || 0}%`

  const art = document.getElementById('art')
  if (state.artUrl) {
    if (art.dataset.src !== state.artUrl) {
      art.dataset.src = state.artUrl
      art.innerHTML = `<img src="${state.artUrl}" alt="" onerror="this.parentElement.innerHTML='♪'">`
    }
  } else {
    art.dataset.src = ''
    art.innerHTML = '♪'
  }

  document.getElementById('icon-play').style.display  = state.isPlaying ? 'none' : ''
  document.getElementById('icon-pause').style.display = state.isPlaying ? '' : 'none'
})

document.getElementById('btn-playpause').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('playpause')
})
document.getElementById('btn-prev').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('prev')
})
document.getElementById('btn-next').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.control('next')
})

// The only explicit close affordance - small, corner, hover-revealed rather
// than sitting permanently over the art. Goes through the same restore() the
// body click below already uses, so there is exactly one path back to the
// main window, not two.
document.getElementById('btn-close').addEventListener('click', (e) => {
  e.stopPropagation()
  window.miniPlayer.restore()
})

// Anywhere else in the window restores the main window, same as clicking a
// Spotify/Apple Music miniplayer does.
document.body.addEventListener('click', () => window.miniPlayer.restore())
</script>
</body>
</html>
