<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade Announcements</title>
<style>
  :root {
    --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --line: #d9d9de;
    --accent: #0a66d8; --accent-fg: #fff; --danger: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f2f7; --muted: #98989d; --bg: #111113; --card: #1c1c1f; --line: #333338; --accent: #3d8bff; --danger: #ff6b6b; --ok: #4cd480; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); gap: 20px; max-width: 72rem; margin: 0 auto; padding: 20px 16px 48px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .list { display: grid; gap: 10px; }
  .item h3 { margin: 0 0 2px; font-size: 16px; overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item .actions { display: flex; gap: 8px; margin-top: 10px; }
  .empty { color: var(--muted); }
  form { display: grid; gap: 12px; position: sticky; top: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
  input:read-only { color: var(--muted); }
  textarea { min-height: 8rem; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  fieldset { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin: 0; }
  fieldset legend { font-size: 13px; color: var(--muted); padding: 0 4px; }
  fieldset label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; color: var(--fg); font-size: 14px; }
  fieldset input { width: auto; }
  button { font: inherit; border-radius: 7px; padding: 7px 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  #status { min-height: 1.5em; font-size: 14px; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Cascade announcements</h1>
  <span class="who" id="who"></span>
  <form method="post" action="/logout" style="position:static;display:block"><button type="submit">Sign out</button></form>
</header>
<main>
  <section>
    <h2>Live now</h2>
    <div class="list" id="list"><p class="empty">Loading…</p></div>
  </section>
  <section>
    <h2 id="formTitle">New announcement</h2>
    <form id="form" class="card" novalidate>
      <div class="row">
        <label>Date <input type="date" name="date" required></label>
        <label>Expires (optional) <input type="date" name="expires"></label>
      </div>
      <label>Title <input name="title" maxlength="120" required></label>
      <label>Body (plain text) <textarea name="body" maxlength="4000"></textarea></label>
      <label>Link (optional) <input type="url" name="link" placeholder="https://"></label>
      <fieldset>
        <legend>Show in</legend>
        <label><input type="checkbox" name="platform" value="desktop" checked> Desktop</label>
        <label><input type="checkbox" name="platform" value="mac" checked> Mac</label>
        <label><input type="checkbox" name="platform" value="ios" checked> iPhone</label>
        <label><input type="checkbox" name="platform" value="tvos" checked> Apple TV</label>
      </fieldset>
      <div class="row">
        <label>From version (optional) <input name="minVersion" placeholder="2.3.0"></label>
        <label>Through version (optional) <input name="maxVersion" placeholder="2.4.0"></label>
      </div>
      <label>Id <input name="id" maxlength="80" placeholder="Made from the date and title">
        <span class="hint">Apps remember dismissals by id, so it can't change once posted.</span></label>
      <div class="buttons">
        <button type="submit" class="primary" id="publish">Publish</button>
        <button type="button" id="newEntry">New announcement</button>
      </div>
      <div id="status" role="status"></div>
      <p class="hint">Apps pick up changes within about 5 minutes.</p>
    </form>
  </section>
</main>
<script>
  // Everything here is text: entries go in with textContent, never as HTML,
  // the same way the apps show them.
  const PLATFORMS = { desktop: 'Desktop', mac: 'Mac', ios: 'iPhone', tvos: 'Apple TV' }
  const $ = id => document.getElementById(id)
  const form = $('form')
  let items = []
  let editing = null

  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props)
    n.append(...kids)
    return n
  }
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50)

  function status(message, kind = '') {
    $('status').textContent = message
    $('status').className = kind
  }

  function render() {
    const list = $('list')
    list.replaceChildren()
    if (!items.length) list.append(el('p', { className: 'empty', textContent: 'Nothing posted. The bell stays hidden in the apps.' }))
    for (const a of items) {
      const where = a.platforms ? a.platforms.map(p => PLATFORMS[p]).join(', ') : 'Every app'
      const meta = [a.date, where, a.minVersion || a.maxVersion ? `versions ${a.minVersion || 'any'} to ${a.maxVersion || 'any'}` : '', a.expires ? `until ${a.expires}` : '', a.author ? `by @${a.author}` : ''].filter(Boolean).join(' · ')
      const card = el('article', { className: 'card item' }, el('h3', { textContent: a.title }), el('div', { className: 'meta', textContent: meta }))
      if (a.body) card.append(el('p', { textContent: a.body }))
      if (a.link) card.append(el('div', { className: 'meta', textContent: a.link }))
      card.append(el('div', { className: 'actions' },
        el('button', { type: 'button', textContent: 'Edit', onclick: () => edit(a) }),
        el('button', { type: 'button', className: 'danger', textContent: 'Delete', onclick: () => remove(a) })))
      list.append(card)
    }
  }

  function edit(a) {
    editing = a ? a.id : null
    form.reset()
    status('')
    $('formTitle').textContent = a ? 'Edit announcement' : 'New announcement'
    const f = form.elements
    f.date.value = a ? a.date : today()
    for (const k of ['expires', 'title', 'body', 'link', 'minVersion', 'maxVersion', 'id']) f[k].value = a?.[k] ?? ''
    f.id.readOnly = !!a
    for (const box of form.querySelectorAll('[name=platform]')) box.checked = !a?.platforms || a.platforms.includes(box.value)
    if (a) form.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }

  function entryFromForm() {
    const f = form.elements
    const v = k => f[k].value.trim()
    const platforms = [...form.querySelectorAll('[name=platform]:checked')].map(b => b.value)
    if (!platforms.length) throw new Error('Pick at least one app to show it in.')
    if (!v('title')) throw new Error('A title is required.')
    if (!v('date')) throw new Error('A date is required.')
    const e = { id: v('id') || `${v('date')}-${slug(v('title'))}`, date: v('date'), title: v('title') }
    for (const k of ['body', 'link', 'minVersion', 'maxVersion', 'expires']) if (v(k)) e[k] = v(k)
    if (platforms.length < Object.keys(PLATFORMS).length) e.platforms = platforms
    return e
  }

  async function publish(next, done) {
    for (const b of document.querySelectorAll('button')) b.disabled = true
    status('Publishing…')
    try {
      const res = await fetch('/admin/announcements.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error || `Failed (${res.status})`)
      items = body.items
      render()
      done()
    } catch (err) {
      status(err.message, 'error')
    } finally {
      for (const b of document.querySelectorAll('button')) b.disabled = false
    }
  }

  form.addEventListener('submit', ev => {
    ev.preventDefault()
    let entry
    try { entry = entryFromForm() } catch (err) { return status(err.message, 'error') }
    const others = items.filter(a => a.id !== editing)
    if (!editing && others.some(a => a.id === entry.id)) return status(`Id "${entry.id}" is already taken. Change the id.`, 'error')
    const next = editing ? items.map(a => a.id === editing ? entry : a) : [entry, ...items]
    publish(next, () => { const was = editing; edit(null); status(was ? 'Updated.' : 'Posted.', 'ok') })
  })

  function remove(a) {
    if (!confirm(`Delete "${a.title}"? It disappears from every app.`)) return
    publish(items.filter(x => x.id !== a.id), () => { if (editing === a.id) edit(null); status('Deleted.', 'ok') })
  }

  $('newEntry').addEventListener('click', () => edit(null))

  fetch('/admin/announcements.json').then(r => r.json().then(b => ({ ok: r.ok, b }))).then(({ ok, b }) => {
    if (!ok) throw new Error(b.error || 'Could not load')
    $('who').textContent = `@${b.login}`
    items = Array.isArray(b.items) ? b.items : []
    render()
  }).catch(err => { $('list').replaceChildren(el('p', { className: 'empty', textContent: err.message })) })
  edit(null)
</script>
</body>
</html>
