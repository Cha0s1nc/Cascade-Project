name: Android

# Tests and builds the Android app in android/ on every change to it. Debug
# build only; release builds are the build-android job in build.yml.

on:
  push:
    branches: ['dev']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: ['dev']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # The same JDK as the release job. The runner's Android SDK has its
      # licenses accepted, so Gradle fetches a missing platform by itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Offline: the live-server suite skips itself without CASCADE_SERVER.
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon test assembleDebug
