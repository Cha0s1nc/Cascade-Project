# When a release is published: copy the platforms a stable release built to
# the download mirror (the native Mac DMG goes to mac/<version>/, the Electron
# one stays under desktop/), and refresh releases.json (every release, betas
# too, with its GitHub notes verbatim) and changelog.json in the R2 bucket,
# where cascade.chaosinc.xyz serves them (/releases.json for its releases page
# and download buttons, /changelog.json for the apps' update windows). Editing
# a release's notes refreshes those two files only. See
# docs/release-pipeline-plan.md, phase 7.
#
# The R2 key is in the release environment, which has to admit v* tags (a
# published release runs on its tag).
name: Publish

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v2.3.0
        required: true
      mirror:
        description: Upload to the download mirror
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  mirror:
    # Stable releases only, once, when first published. Betas are not mirrored.
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && inputs.mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the platforms this release built
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a stable release tag: $TAG"; exit 1; }
          # versions.json says which platforms are at this release's version;
          # the rest were carried over and are mirrored under their own release.
          if gh release download "$TAG" -p versions.json -D meta 2>/dev/null; then
            BUILT=$(jq -r --arg v "$VERSION" 'to_entries[] | select(.value == $v) | .key' meta/versions.json)
          else
            BUILT=desktop   # releases before versions.json were desktop only
          fi
          for p in $BUILT; do
            ARGS=(); while read -r pat; do ARGS+=(-p "$pat"); done < <(node shared/scripts/release-plan.mjs files "$p")
            gh release download "$TAG" "${ARGS[@]}" -D "up/$p/$VERSION"
            # desktop's *.dmg also fetched the native Mac DMG, which is its own
            # platform (mac/<ver>/) with its own version in versions.json.
            if [ "$p" = desktop ]; then rm -f "up/desktop/$VERSION"/Cascade-Native-*; fi
          done
          find up -type f | sort

      - name: Upload to the mirror
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
          MIRROR_HOST: ${{ vars.MIRROR_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to rrsync in the mirror folder on the server.
          # Additive only: never --delete; the server prunes old versions.
          rsync -rt -e "ssh -i $HOME/.ssh/mirror -o IdentitiesOnly=yes" up/ "cascade-mirror@$MIRROR_HOST:"

  website:
    needs: mirror
    # Runs even if the mirror failed or was skipped: the data then simply has
    # no mirror links for this release.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build releases.json and changelog.json
        env:
          REPO: ${{ github.repository }}
          MIRROR_URL: ${{ vars.MIRROR_URL }}
        run: OUT_DIR=site-data node shared/scripts/site-data.mjs

      - name: Upload them to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          EP: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          for f in releases.json changelog.json; do
            aws s3 cp "site-data/$f" "s3://$BUCKET/$f" --endpoint-url "$EP" \
              --content-type application/json --cache-control "public, max-age=300"
          done
          curl -fsS -o /dev/null https://cascade.chaosinc.xyz/releases.json && echo "Served at https://cascade.chaosinc.xyz/releases.json"
